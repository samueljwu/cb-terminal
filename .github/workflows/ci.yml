name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: python -m pip install -e '.[prospectus]'

      - name: Block private financial artifacts
        run: python scripts/check_public_tree.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile Python
        run: python -m compileall -q cb_terminal tests scripts
